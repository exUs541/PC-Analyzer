name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How should it work? Sketches and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: safety
    attributes:
      label: Does it change files on the PC?
      description: Anything that copies, moves or removes files needs extra care (see CONTRIBUTING.md).
      options: ["No, it only reads", "Yes"]
