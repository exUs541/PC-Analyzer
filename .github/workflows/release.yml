# Builds the installer and the update packages and publishes a release when a version tag (v1.2.3) is pushed or the workflow is started by hand.
# Nothing is published unless ALL tests are green. Installed apps find the release on their own and update in the background (docs/architecture.md).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (empty: 3.0.<number of commits>)'
        required: false

permissions:
  contents: write

# one release at a time; a newer push waits instead of cancelling a release that is being uploaded
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version number counts the commits

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Version
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then v="$INPUT_VERSION"
          else v="3.0.$(git rev-list --count HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # nothing is released if one of these fails
      - name: Dashboard logic tests
        shell: bash
        run: |
          node tests/make-fixtures.js
          node --test tests/

      - name: App tests
        run: dotnet test app/LaptopCheck.slnx -c Release --nologo

      # real install -> background update -> "update now" -> uninstall, with a separate test id (see app/tools/test-install.ps1)
      - name: Install, update and uninstall test
        shell: pwsh
        run: ./app/tools/test-install.ps1

      # earlier releases first, so that Velopack can build small delta updates (fails on the very first release: fine)
      - name: Download earlier releases
        continue-on-error: true
        working-directory: app
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" -o artifacts/releases

      - name: Pack installer and update packages
        shell: pwsh
        run: ./app/tools/pack.ps1 -Version "${{ steps.v.outputs.version }}"

      - name: Publish the release
        working-directory: app
        run: >
          dotnet vpk upload github
          --repoUrl "https://github.com/${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}"
          --publish
          --releaseName "LaptopCheck ${{ steps.v.outputs.version }}"
          --tag "v${{ steps.v.outputs.version }}"
          -o artifacts/releases
